# Kitty configuration
# Migrated from WezTerm

# Terminal type - required for kitty graphics protocol
term xterm-kitty

# Font configuration
font_family BerkeleyMono Nerd Font
font_size 13
modify_font cell_height 125%
symbol_map U+E000-U+E4FF QsIcons
# Force the agent-rail glyphs (status swatch + section/title icons) to a single cell.
# The font renders many double-wide while nvim measures them as 1 col, which broke
# column alignment in the rail; 1 cell matches nvim so titles/rows/composer line up.
# One codepoint per line — narrow_symbols reads the first token as the codepoint and
# the rest as the cell count, so it can't take a list on one line.
narrow_symbols U+F14FB 1
narrow_symbols U+F06A5 1
narrow_symbols U+F06A6 1
narrow_symbols U+F0026 1
narrow_symbols U+F0756 1
narrow_symbols U+F09EE 1
narrow_symbols U+F062C 1
narrow_symbols U+F0493 1
narrow_symbols U+F002A 1
narrow_symbols U+F140B 1
narrow_symbols U+F0B67 1
narrow_symbols U+F04FC 1

# Window appearance
hide_window_decorations yes
# top right bottom left. The right edge is bumped to ~2 cells so the agent rail's
# right padding (terminal edge → box border) matches its 2-col left gutter.
window_padding_width 10 16 10 10

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 10.0
touch_scroll_multiplier 12.0

# Cursor
cursor_beam_thickness 2
cursor_shape beam
cursor_trail 15
cursor_trail_decay 0.05 0.15

# Mouse
mouse_hide_wait 3.0

# Shell
shell fish

# Disable confirm on close
confirm_os_window_close 0

# Tab bar (disabled like WezTerm)
tab_bar_style hidden

# kitty-scrollback.nvim
# Uses path relative to kitty config dir via the kitty-scrollback.nvim symlink,
# since kitty 0.46.2 broke absolute-path kitten resolution
# ("Out of buffer space calling sprintf at line: 300").
action_alias kitty_scrollback_nvim kitten kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Keybindings
# Ctrl+S for scrollback/copy mode in nvim
map ctrl+s kitty_scrollback_nvim

# Ctrl+Shift+V paste
map ctrl+shift+v paste_from_clipboard

# Ctrl+Shift+R reload config
map ctrl+shift+r load_config_file

# Half-page scroll at the shell prompt; pass-through to alt-screen apps
# (nvim, less, claude TUI, …) so their native Ctrl+U/D still works.
map ctrl+u kitten half_page_scroll.py up
map ctrl+d kitten half_page_scroll.py down

# Allow remote control (for theme switching)
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Theme follows the OS light/dark scheme natively via the
# {dark,light,no-preference}-theme.auto.conf files (generated by
# theme-manager). kitty picks + hot-reloads the right one on OS change —
# no include, no remote-control broadcast.
