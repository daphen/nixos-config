# Yazi theme — generated from colors.json, do not hand-edit

[mgr]
cwd = { fg = "#e16511" }
# generated tmTheme (yazi-tmtheme.template) — preview syntax highlighting
syntect_theme = "~/.config/yazi/syntect.tmTheme"

# Hovered
hovered         = { fg = "#FFFFFF", bg = "#e16511" }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#df9001", italic = true }
find_position = { fg = "#2a618d", bg = "reset", italic = true }

# Marker
marker_copied   = { fg = "#587969", bg = "#587969" }
marker_cut      = { fg = "#7c3438", bg = "#7c3438" }
marker_marked   = { fg = "#243560", bg = "#243560" }
marker_selected = { fg = "#243560", bg = "#243560" }

# Count
count_copied   = { fg = "#FFFFFF", bg = "#587969" }
count_cut      = { fg = "#FFFFFF", bg = "#7c3438" }
count_selected = { fg = "#FFFFFF", bg = "#243560" }

# Border
border_symbol = "│"
border_style  = { fg = "#959693" }

[tabs]
active   = { fg = "#FFFFFF", bg = "#587969", bold = true }
inactive = { fg = "#3C3C3A", bg = "#F4F5F2" }

[mode]
normal_main = { fg = "#587969", bg = "reset", bold = true }
normal_alt  = { fg = "#959693", bg = "reset" }

select_main = { fg = "#e16511", bg = "reset", bold = true }
select_alt  = { fg = "#df9001", bg = "reset" }

unset_main  = { fg = "#2a618d", bg = "reset", bold = true }
unset_alt   = { fg = "#959693", bg = "reset" }

[status]
overall = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#959693" }
perm_type  = { fg = "#587969" }
perm_read  = { fg = "#df9001" }
perm_write = { fg = "#7c3438" }
perm_exec  = { fg = "#587969" }

progress_label  = { fg = "#10100E", bold = true }
progress_normal = { fg = "#FFFFFF", bg = "#587969" }
progress_error  = { fg = "#7c3438", bg = "#F6F7F4" }

[pick]
border   = { fg = "#587969" }
active   = { fg = "#2a618d", bold = true }
inactive = {}

[input]
border   = { fg = "#587969" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border = { fg = "#587969" }

[tasks]
border  = { fg = "#587969" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#E9EAE7" }
cand            = { fg = "#243560" }
rest            = { fg = "#959693" }
desc            = { fg = "#2a618d" }
separator       = "  "
separator_style = { fg = "#959693" }

[help]
on      = { fg = "#2a618d" }
exec    = { fg = "#243560" }
desc    = { fg = "#959693" }
hovered = { bg = "#F4F5F2", bold = true }
footer  = { fg = "#FFFFFF", bg = "#587969" }

[spotter]
border = { fg = "#587969" }

[notification]
info  = { fg = "#FFFFFF", bg = "#587969" }
warn  = { fg = "#FFFFFF", bg = "#df9001" }
error = { fg = "#FFFFFF", bg = "#7c3438" }

[filetype]
rules = [
	# Images
	{ mime = "image/*", fg = "#243560" },

	# Videos
	{ mime = "video/*", fg = "#df9001" },

	# Audio
	{ mime = "audio/*", fg = "#df9001" },

	# Archives
	{ mime = "application/zip",             fg = "#2a618d" },
	{ mime = "application/gzip",            fg = "#2a618d" },
	{ mime = "application/x-tar",           fg = "#2a618d" },
	{ mime = "application/x-bzip",          fg = "#2a618d" },
	{ mime = "application/x-bzip2",         fg = "#2a618d" },
	{ mime = "application/x-7z-compressed", fg = "#2a618d" },
	{ mime = "application/x-rar",           fg = "#2a618d" },

	# Documents
	{ mime = "application/doc",   fg = "#587969" },
	{ mime = "application/pdf",   fg = "#587969" },
	{ mime = "application/rtf",   fg = "#587969" },
	{ mime = "application/vnd.*", fg = "#587969" },

	# Fallback
	{ name = "*", fg = "#10100E" },
	{ name = "*/", fg = "#587969" }
]
