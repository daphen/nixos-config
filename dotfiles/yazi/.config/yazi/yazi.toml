[mgr]
# show each item's modification date, and sort newest-first in every folder
linemode = "mtime"
sort_by = "mtime"
sort_reverse = true
sort_dir_first = true

[opener]
imv = [
	{ run = '~/.config/niri/scripts/imv-open "$@"', orphan = true, desc = "imv", for = "unix" },
]
mpv = [
	{ run = 'mpv "$@"', orphan = true, desc = "mpv", for = "unix" },
]

[open]
prepend_rules = [
	{ mime = "image/*", use = "imv" },
	{ mime = "video/*", use = "mpv" },
]
