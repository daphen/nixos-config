# Copy a track's share link to the clipboard. CopyLink is an action (not a
# bindable command), so it's wired via [[actions]]:
#   Y — the currently PLAYING track
#   y — the track highlighted in the current list/table
[[actions]]
action = "CopyLink"
key_sequence = "Y"
target = "PlayingTrack"

[[actions]]
action = "CopyLink"
key_sequence = "y"
target = "SelectedItem"
