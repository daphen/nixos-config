# Loaded explicitly via --config by niri/scripts/screenshot-to-clipboard —
# not symlinked into ~/.config, so no home-manager wiring needed.

[general]
initial-tool = "crop"
# One encode: the wrapper tees the PNG to $SCREENSHOT_FILE + wl-copy, so we
# skip save-after-copy's second full encode of the 4K crop.
copy-command = "/home/daphen/.config/niri/scripts/satty-copy"
save-after-copy = false
early-exit = true
actions-on-enter = ["save-to-clipboard"]
actions-on-escape = ["exit"]
# the screenshot script sends its own notification
disable-notifications = true
corner-roundness = 8

# Vim-flavored tool keys: v=select like visual mode, l=line (default "i"
# reads as insert), a=arrow (default "z"). Rest keep upstream mnemonics.
[keybinds]
pointer = "v"
crop = "c"
brush = "b"
line = "l"
arrow = "a"
rectangle = "r"
ellipse = "e"
text = "t"
marker = "m"
blur = "u"
highlight = "g"

# House accents (themes/colors.json)
[color-palette]
palette = [
    "#FF7B72FF", # red
    "#FF570DFF", # orange
    "#FF8A31FF", # yellow
    "#97B5A6FF", # green
    "#7DD3FCFF", # sky
    "#EDEDEDFF", # fg primary
]
