<!doctype html>
<!--
  review-pr render template. render.py fills the double-brace slots; never hand-edit output.
  Slots (names only, braces omitted here so this comment isn't substituted):
    MODE PALETTE TITLE META VERDICT_CLASS VERDICT_BADGE VERDICT_WHY
    DIAGRAM FINDINGS FILEMAP INTENT VERIFICATION NUM
  Fragment HTML uses these component classes (all colours are --rv-* vars):
    diagram : .flow > (.lane.be|.tr|.fe > .lane-tag + .node[.hl] + .arrow[.big] + .split>.node),
              .node>.file/.sub, .node>.tag-nit/.tag-drop
    finding : .finding > .top(.sev.nit|.drop + .loc) + <pre> lines .ln[.bad|.good|.strike]
              with spans .c/.k/.s + .note[.drop]
    filemap : .fmap > .grp(h3 + .frow(.nm + .bar[.new] + .ct))
    intent  : <ul class=intent> <li[.info]>
    verify  : rows <div>[.warn|.muted]
-->
<html lang="en" class="theme-{{MODE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · PR #{{NUM}}</title>
<style>
/* ── palette: inlined from ~/.config/themes/generated/review/<mode>.theme ── */
{{PALETTE}}

/* ── layout ── */
*{box-sizing:border-box}
.mono,pre,.file,.loc,.meta,.frow,.foot,.lane-tag,.grp h3,.tag-nit,.tag-drop,.sev,.badge{font-family:ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,monospace}
body{margin:0;background:var(--rv-bg);color:var(--rv-fg);line-height:1.5;-webkit-font-smoothing:antialiased;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:32px 24px 80px}
a{color:var(--rv-blue);text-decoration:none}a:hover{text-decoration:underline}
header h1{font-size:20px;margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
header .meta{color:var(--rv-muted);font-size:13px}header .meta b{color:var(--rv-fg);font-weight:600}
.verdict{margin:22px 0 8px;padding:16px 18px;border-radius:12px;border:1px solid var(--rv-hair);
  background:var(--rv-surface);display:flex;align-items:center;gap:14px}
.verdict .badge{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--rv-bg);padding:6px 12px;border-radius:999px;white-space:nowrap}
.badge.approve{background:var(--rv-green)}.badge.changes{background:var(--rv-red)}.badge.comment{background:var(--rv-blue)}
.verdict .why{font-size:14px}.verdict .why .note{color:var(--rv-muted);font-size:12.5px;display:block;margin-top:2px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--rv-muted);margin:36px 0 14px;font-weight:700}

.flow{display:flex;flex-direction:column;align-items:center}
.lane{width:100%;border-radius:12px;padding:14px 16px 18px;border:1px solid var(--rv-hair)}
.lane.be{background:color-mix(in srgb,var(--rv-green) 12%,transparent);border-left:4px solid var(--rv-green)}
.lane.tr{background:color-mix(in srgb,var(--rv-yellow) 12%,transparent);border-left:4px solid var(--rv-yellow)}
.lane.fe{background:color-mix(in srgb,var(--rv-blue) 12%,transparent);border-left:4px solid var(--rv-blue)}
.lane-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rv-muted);margin-bottom:10px}
.node{background:var(--rv-bg);border:1px solid var(--rv-hair);border-radius:9px;padding:9px 13px;margin:0 auto;
  max-width:560px;text-align:center;font-size:13.5px;font-weight:600;position:relative}
.node .file{display:block;font-size:11px;color:var(--rv-muted);font-weight:400;margin-top:2px}
.node .sub{display:block;font-size:11.5px;color:var(--rv-muted);font-weight:400;margin-top:3px}
.node.hl{border-color:var(--rv-blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--rv-blue) 22%,transparent)}
.split{display:flex;gap:12px;max-width:560px;margin:0 auto}.split .node{flex:1}
.arrow{color:var(--rv-muted);text-align:center;font-size:13px;line-height:1;padding:6px 0}
.arrow.big{padding:10px 0;color:var(--rv-fg)}
.tag-nit,.tag-drop{position:absolute;top:-9px;right:10px;font-size:9.5px;font-weight:700;letter-spacing:.04em;
  padding:2px 7px;border-radius:999px;color:var(--rv-bg)}
.tag-nit{background:var(--rv-blue)}.tag-drop{background:var(--rv-muted)}

.fmap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.fmap{grid-template-columns:1fr}.split{flex-direction:column}}
.grp{border:1px solid var(--rv-hair);border-radius:11px;padding:12px 14px;background:var(--rv-surface)}
.grp h3{margin:0 0 10px;font-size:12px;color:var(--rv-fg);font-weight:700}
.frow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11px}
.frow .nm{flex:1;color:var(--rv-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .ct{color:var(--rv-muted);white-space:nowrap}
.bar{height:7px;border-radius:4px;background:color-mix(in srgb,var(--rv-green) 70%,transparent);min-width:3px}
.bar.new{background:color-mix(in srgb,var(--rv-cursor) 80%,transparent)}

.finding{margin:14px 0}
.finding .top{display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.sev{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:var(--rv-bg)}
.sev.blocker{background:var(--rv-red)}.sev.should{background:var(--rv-orange)}.sev.nit{background:var(--rv-blue)}.sev.drop{background:var(--rv-muted)}
.loc{font-size:12px;color:var(--rv-fg);font-weight:600}
pre{margin:0;background:var(--rv-code-bg);color:var(--rv-code-fg);border:1px solid var(--rv-hair);border-radius:9px;
  padding:12px 14px;overflow-x:auto;font-size:12px;line-height:1.55}
pre .ln{display:block;padding:0 6px;border-left:3px solid transparent}
pre .ln.bad{background:color-mix(in srgb,var(--rv-orange) 16%,transparent);border-left-color:var(--rv-orange)}
pre .ln.good{background:color-mix(in srgb,var(--rv-green) 16%,transparent);border-left-color:var(--rv-green)}
pre .ln.strike{opacity:.55;text-decoration:line-through}
pre .c{color:var(--rv-muted)}pre .k{color:var(--rv-purple)}pre .s{color:var(--rv-green)}
.note{font-size:13px;margin:8px 2px 0;color:var(--rv-fg)}.note b{color:var(--rv-orange)}.note.drop b{color:var(--rv-green)}
ul.intent{list-style:none;padding:0;margin:0}
ul.intent li{padding:7px 0 7px 24px;position:relative;font-size:13.5px;border-bottom:1px solid var(--rv-hair)}
ul.intent li:last-child{border-bottom:0}
ul.intent li::before{position:absolute;left:0;top:7px;font-weight:700;content:"✓";color:var(--rv-green);font-family:ui-monospace,monospace}
ul.intent li.info::before{content:"•";color:var(--rv-muted)}
.verify{font-size:13px;background:var(--rv-alt);border:1px solid var(--rv-hair);border-radius:10px;padding:14px 16px}
.verify div{padding:3px 0}.verify .warn{color:var(--rv-orange)}.verify .muted{color:var(--rv-muted)}
.foot{margin-top:40px;color:var(--rv-muted);font-size:12px;border-top:1px solid var(--rv-hair);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{TITLE}}</h1>
    <div class="meta">{{META}}</div>
  </header>

  <div class="verdict"><span class="badge {{VERDICT_CLASS}}">{{VERDICT_BADGE}}</span>
    <span class="why">{{VERDICT_WHY}}</span></div>

  <h2>How the change works</h2>
  <div class="flow">{{DIAGRAM}}</div>

  <h2>Findings</h2>
  {{FINDINGS}}

  <h2>Change footprint</h2>
  <div class="fmap">{{FILEMAP}}</div>

  <h2>Intent</h2>
  <ul class="intent">{{INTENT}}</ul>

  <h2>Verification</h2>
  <div class="verify">{{VERIFICATION}}</div>

  <div class="foot mono">Local review · nothing posted to GitHub · reopen: pr-review-open {{NUM}}</div>
</div>
</body>
</html>
